<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 340">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#49627a"/></marker>
    <style>
      .box{stroke:#49627a;stroke-width:2;rx:12}
      .head{font:700 16px Arial;fill:#132b3e}
      .body{font:14px Arial;fill:#31495e}
      .edge{stroke:#49627a;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .small{font:13px Arial;fill:#526a7e}
    </style>
  </defs>
  <rect width="1400" height="340" fill="#fbfdff"/>
  <rect x="30" y="20" width="300" height="150" fill="#eaf2fb" class="box"/>
  <text x="48" y="48" class="head">1  PatentsView grants</text>
  <text x="48" y="78" class="body">Organization assignees</text>
  <text x="48" y="102" class="body">Grant years 2010–2023</text>
  <text x="48" y="126" class="body">CPC subclass (four characters)</text>
  <text x="48" y="152" class="small">firm_id, year, cpc_code</text>
  <rect x="370" y="20" width="300" height="150" fill="#e8f6f1" class="box"/>
  <text x="388" y="48" class="head">2  Graph G_t</text>
  <text x="388" y="78" class="body">Firm–class edges dated ≤ t</text>
  <text x="388" y="102" class="body">Class co-occurrence</text>
  <text x="388" y="126" class="body">Candidates fixed in 2010–2012</text>
  <text x="388" y="152" class="small">No future edges in features</text>
  <rect x="710" y="20" width="310" height="150" fill="#fff3df" class="box"/>
  <text x="728" y="48" class="head">3  Feature blocks</text>
  <text x="728" y="78" class="body">Size, activity, prevalence, growth</text>
  <text x="728" y="102" class="body">Common-neighbor; peer adoption</text>
  <text x="728" y="126" class="body">Candidate co-occurrence degree</text>
  <text x="728" y="152" class="small">Graph block used only in M3</text>
  <rect x="1060" y="20" width="310" height="150" fill="#f2ecfb" class="box"/>
  <text x="1078" y="48" class="head">4  Same-candidate models</text>
  <text x="1078" y="78" class="body">M1 logistic regression</text>
  <text x="1078" y="102" class="body">M2 tabular random forest</text>
  <text x="1078" y="126" class="body">M3 forest + graph features</text>
  <text x="1078" y="152" class="small">Primary contrast: M3 versus M2</text>
  <path d="M330 95 H362" class="edge"/>
  <path d="M670 95 H702" class="edge"/>
  <path d="M1020 95 H1052" class="edge"/>
  <rect x="30" y="190" width="1340" height="130" fill="#fff" stroke="#9db0c0" stroke-width="2" rx="12"/>
  <text x="50" y="220" class="head">5  Executed holdout</text>
  <text x="50" y="250" class="body">Train 2013–2019 (1,540,698 pairs) · embargo 2020 · test 2021–2022 (455,458 pairs; 10,411 firms; 1.11% positives)</text>
  <text x="50" y="278" class="body">Primary metric: average precision. Uncertainty: firm-cluster bootstrap for M3 − M2.</text>
  <text x="50" y="304" class="small">Every feature at year t uses records dated ≤ t. The label is first CPC-subclass entry in t+1.</text>
</svg>
