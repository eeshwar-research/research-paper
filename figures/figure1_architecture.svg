<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#49627a"/>
    </marker>
    <style>
      .h{font:700 26px Arial,sans-serif;fill:#132b3e}
      .sub{font:16px Arial,sans-serif;fill:#41566a}
      .box{stroke:#315d91;stroke-width:2;rx:14}
      .head{font:700 17px Arial,sans-serif;fill:#132b3e}
      .body{font:15px Arial,sans-serif;fill:#31495e}
      .edge{stroke:#49627a;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .small{font:14px Arial,sans-serif;fill:#526a7e}
    </style>
  </defs>
  <rect width="1400" height="620" fill="#fbfdff"/>
  <text x="48" y="48" class="h">Knowledge-graph feature pipeline for firm-specific technology-entry prediction</text>
  <text x="48" y="78" class="sub">Every feature at prediction year t uses only records dated &lt;= t; the target is first CPC-subclass entry in t+1.</text>
  <rect x="48" y="118" width="300" height="180" fill="#eaf2fb" class="box"/>
  <text x="68" y="150" class="head">1  Time-stamped inputs</text>
  <text x="68" y="186" class="body">firm_id, year, cpc_code</text>
  <text x="68" y="214" class="body">USPTO PatentsView records</text>
  <text x="68" y="242" class="body">Normalized CPC subclass</text>
  <rect x="388" y="118" width="300" height="180" fill="#e8f6f1" class="box"/>
  <text x="408" y="150" class="head">2  Graph G_t</text>
  <text x="408" y="186" class="body">Firms and CPC classes</text>
  <text x="408" y="214" class="body">Edges observed by year t</text>
  <text x="408" y="242" class="body">Class co-occurrence by t</text>
  <rect x="728" y="118" width="300" height="180" fill="#fff3df" class="box"/>
  <text x="748" y="150" class="head">3  Inspectable features</text>
  <text x="748" y="186" class="body">Portfolio size and activity</text>
  <text x="748" y="214" class="body">Class prevalence and growth</text>
  <text x="748" y="242" class="body">CN, peer rate, graph degree</text>
  <rect x="1068" y="118" width="284" height="180" fill="#f2ecfb" class="box"/>
  <text x="1088" y="150" class="head">4  Controlled models</text>
  <text x="1088" y="186" class="body">M1 logistic regression</text>
  <text x="1088" y="214" class="body">M2 random forest</text>
  <text x="1088" y="242" class="body">M3 graph-feature RF</text>
  <path d="M348 208 H380" class="edge"/>
  <path d="M688 208 H720" class="edge"/>
  <path d="M1028 208 H1060" class="edge"/>
  <rect x="48" y="340" width="1304" height="200" fill="#ffffff" stroke="#9db0c0" stroke-width="2" rx="16"/>
  <text x="72" y="376" class="head">5  Shared evaluation</text>
  <rect x="72" y="400" width="290" height="100" fill="#f5f8fb" stroke="#c3d0dc" rx="10"/>
  <text x="217" y="440" text-anchor="middle" class="body">Discrimination</text>
  <text x="217" y="468" text-anchor="middle" class="small">Average precision + prevalence</text>
  <rect x="384" y="400" width="290" height="100" fill="#f5f8fb" stroke="#c3d0dc" rx="10"/>
  <text x="529" y="440" text-anchor="middle" class="body">Calibration</text>
  <text x="529" y="468" text-anchor="middle" class="small">Brier score</text>
  <rect x="696" y="400" width="290" height="100" fill="#f5f8fb" stroke="#c3d0dc" rx="10"/>
  <text x="841" y="440" text-anchor="middle" class="body">Incremental value</text>
  <text x="841" y="468" text-anchor="middle" class="small">Firm-clustered bootstrap</text>
  <rect x="1008" y="400" width="316" height="100" fill="#f5f8fb" stroke="#c3d0dc" rx="10"/>
  <text x="1166" y="440" text-anchor="middle" class="body">Robustness</text>
  <text x="1166" y="468" text-anchor="middle" class="small">Cutoffs and ablation</text>
  <text x="48" y="580" class="small">Design principle: relational complexity is justified only by measured out-of-time value under a frozen candidate universe.</text>
</svg>
