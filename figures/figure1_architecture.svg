<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#49627a"/></marker><style>.h{font:700 28px Arial;fill:#132b3e}.sub{font:18px Arial;fill:#41566a}.box{stroke:#49627a;stroke-width:2;rx:16}.head{font:700 19px Arial;fill:#132b3e}.body{font:16px Arial;fill:#31495e}.edge{stroke:#49627a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.small{font:15px Arial;fill:#526a7e}</style></defs><rect width="1400" height="620" fill="#fbfdff"/><text x="55" y="55" class="h">Knowledge-graph-enhanced entrepreneurial innovation prediction</text><text x="55" y="86" class="sub">Explicit firm–technology relations are converted into temporally valid features and tested against strong tabular baselines.</text><rect x="50" y="130" width="275" height="155" fill="#eaf2fb" class="box"/><text x="75" y="165" class="head">1  Time-stamped inputs</text><text x="75" y="198" class="body">Firm-year attributes</text><text x="75" y="224" class="body">Digital and analytics capability</text><text x="75" y="250" class="body">R&amp;D, industry, prior innovation</text><rect x="365" y="130" width="285" height="155" fill="#e8f6f1" class="box"/><text x="390" y="165" class="head">2  Relational knowledge</text><text x="390" y="198" class="body">Firm ↔ technology concepts</text><text x="390" y="224" class="body">Industry and peer relations</text><text x="390" y="250" class="body">Timestamped edges</text><rect x="690" y="130" width="300" height="155" fill="#fff3df" class="box"/><text x="715" y="165" class="head">3  Leakage-safe features</text><text x="715" y="198" class="body">Technology diversity</text><text x="715" y="224" class="body">Historical technology-peer signal</text><text x="715" y="250" class="body">Historical industry-peer signal</text><rect x="1030" y="130" width="320" height="155" fill="#f2ecfb" class="box"/><text x="1055" y="165" class="head">4  Controlled comparison</text><text x="1055" y="198" class="body">Logistic regression</text><text x="1055" y="224" class="body">Random forest vs. graph-enhanced RF</text><text x="1055" y="250" class="body">Same chronological holdout</text><path d="M325 207 H357" class="edge"/><path d="M650 207 H682" class="edge"/><path d="M990 207 H1022" class="edge"/><rect x="160" y="355" width="1080" height="175" fill="#fff" stroke="#9db0c0" stroke-width="2" rx="18"/><text x="195" y="395" class="head">5  Evaluation and decision relevance</text><g><rect x="195" y="420" width="220" height="68" fill="#f5f8fb" stroke="#c3d0dc" rx="10"/><text x="305" y="447" text-anchor="middle" class="body">Discrimination</text><text x="305" y="470" text-anchor="middle" class="small">ROC-AUC / AP</text><rect x="435" y="420" width="220" height="68" fill="#f5f8fb" stroke="#c3d0dc" rx="10"/><text x="545" y="447" text-anchor="middle" class="body">Calibration</text><text x="545" y="470" text-anchor="middle" class="small">Brier / reliability</text><rect x="675" y="420" width="220" height="68" fill="#f5f8fb" stroke="#c3d0dc" rx="10"/><text x="785" y="447" text-anchor="middle" class="body">Incremental value</text><text x="785" y="470" text-anchor="middle" class="small">Paired bootstrap CI</text><rect x="915" y="420" width="285" height="68" fill="#f5f8fb" stroke="#c3d0dc" rx="10"/><text x="1057" y="447" text-anchor="middle" class="body">Robustness</text><text x="1057" y="470" text-anchor="middle" class="small">Time splits / ablation</text></g><path d="M1190 285 V325 H700 V347" class="edge"/><text x="55" y="580" class="small">Design principle: every feature must be available at prediction time; relational complexity is justified only by measured out-of-time value.</text></svg>