<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="220" viewBox="0 0 1400 220">
  <defs>
    <marker id="fig2-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1400" height="220" fill="#ffffff"/>
  <path d="M40 48 H1360" fill="none" stroke="#000000" stroke-width="2.4" marker-end="url(#fig2-arrow)"/>
  <rect x="40" y="70" width="250" height="92" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="165" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000">2010–2012</text>
  <text x="165" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#000000">Fix 30 CPC candidates</text>
  <text x="165" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000000">Burn-in only</text>
  <rect x="310" y="70" width="420" height="92" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="520" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000">2013–2019</text>
  <text x="520" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#000000">1,540,698 training pairs</text>
  <text x="520" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000000">2019 used for thresholds</text>
  <rect x="750" y="70" width="160" height="92" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="830" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000">2020</text>
  <text x="830" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#000000">Embargo</text>
  <text x="830" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000000">Unused year</text>
  <rect x="930" y="70" width="360" height="92" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="1110" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000">2021–2022</text>
  <text x="1110" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#000000">455,458 pairs; 10,411 firms</text>
  <text x="1110" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000000">Labels unused in fitting</text>
  <text x="40" y="196" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000000">M1 and M2 use activity features only. M3 adds common-neighbor, peer-adoption, and degree features. A second chronological cutoff was not run.</text>
