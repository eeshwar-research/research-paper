<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="220" viewBox="0 0 1400 220">
  <defs>
    <style>
      .lab{font:700 14px Arial, Helvetica, sans-serif;fill:#0f172a}
      .txt{font:13px Arial, Helvetica, sans-serif;fill:#1e293b}
      .note{font:12px Arial, Helvetica, sans-serif;fill:#334155}
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1400" height="220" fill="#ffffff"/>
  <path d="M40 48 H1360" stroke="#334155" stroke-width="2.4" marker-end="url(#arr)"/>
  <rect x="40" y="70" width="250" height="92" rx="8" fill="#e8eef6" stroke="#1e3a5f" stroke-width="1.8"/>
  <text x="165" y="100" text-anchor="middle" class="lab">2010–2012</text>
  <text x="165" y="124" text-anchor="middle" class="txt">Fix 30 CPC candidates</text>
  <text x="165" y="146" text-anchor="middle" class="note">Burn-in only</text>
  <rect x="310" y="70" width="420" height="92" rx="8" fill="#d9e4f2" stroke="#1e3a5f" stroke-width="1.8"/>
  <text x="520" y="100" text-anchor="middle" class="lab">2013–2019</text>
  <text x="520" y="124" text-anchor="middle" class="txt">1,540,698 training pairs</text>
  <text x="520" y="146" text-anchor="middle" class="note">2019 used for thresholds</text>
  <rect x="750" y="70" width="160" height="92" rx="8" fill="#f4eee4" stroke="#7a5b20" stroke-width="1.8"/>
  <text x="830" y="100" text-anchor="middle" class="lab">2020</text>
  <text x="830" y="124" text-anchor="middle" class="txt">Embargo</text>
  <text x="830" y="146" text-anchor="middle" class="note">Unused year</text>
  <rect x="930" y="70" width="360" height="92" rx="8" fill="#dceee3" stroke="#215c3a" stroke-width="1.8"/>
  <text x="1110" y="100" text-anchor="middle" class="lab">2021–2022</text>
  <text x="1110" y="124" text-anchor="middle" class="txt">455,458 pairs; 10,411 firms</text>
  <text x="1110" y="146" text-anchor="middle" class="note">Labels unused in fitting</text>
  <text x="40" y="196" class="note">M1 and M2 use activity features only. M3 adds common-neighbor, peer-adoption, and degree features. A second chronological cutoff was not run.</text>
</svg>
