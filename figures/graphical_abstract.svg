<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1328" height="531" viewBox="0 0 1328 531">
  <defs>
    <marker id="ga-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L0,9 L9,4.5 z" fill="#1e293b"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .label { font: 700 18px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .note  { font: 600 15px Arial, Helvetica, sans-serif; fill: #334155; }
      .hero  { font: 700 48px Arial, Helvetica, sans-serif; fill: #14532d; }
      .hero-sub { font: 700 18px Arial, Helvetica, sans-serif; fill: #14532d; }
      .barlab { font: 700 16px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .panel { stroke: #1e293b; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1328" height="531" fill="#ffffff"/>

  <rect x="16" y="16" width="408" height="499" rx="14" fill="#e8eef6" class="panel"/>
  <text x="220" y="52" text-anchor="middle" class="title">Time-valid graph G(t)</text>

  <circle cx="86" cy="150" r="18" fill="#1e3a5f"/>
  <circle cx="86" cy="230" r="18" fill="#1e3a5f"/>
  <circle cx="86" cy="310" r="18" fill="#1e3a5f"/>
  <text x="86" y="365" text-anchor="middle" class="note">Firms</text>
  <rect x="318" y="128" width="44" height="44" rx="6" fill="#215c3a"/>
  <rect x="318" y="198" width="44" height="44" rx="6" fill="#215c3a"/>
  <rect x="318" y="268" width="44" height="44" rx="6" fill="#215c3a"/>
  <rect x="318" y="338" width="44" height="44" rx="6" fill="#ffffff" stroke="#7a5b20" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="340" y="412" text-anchor="middle" class="note">CPC classes</text>
  <line x1="104" y1="150" x2="318" y2="150" stroke="#1e3a5f" stroke-width="3"/>
  <line x1="104" y1="150" x2="318" y2="220" stroke="#1e3a5f" stroke-width="3"/>
  <line x1="104" y1="230" x2="318" y2="220" stroke="#1e3a5f" stroke-width="3"/>
  <line x1="104" y1="230" x2="318" y2="290" stroke="#1e3a5f" stroke-width="3"/>
  <line x1="104" y1="310" x2="318" y2="290" stroke="#1e3a5f" stroke-width="3"/>
  <line x1="104" y1="230" x2="318" y2="360" stroke="#7a5b20" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="220" y="456" text-anchor="middle" class="label">Predict first entry in t+1</text>
  <text x="220" y="486" text-anchor="middle" class="note">Edges and features dated &#8804; t</text>

  <path d="M436 266 H466" stroke="#1e293b" stroke-width="4" marker-end="url(#ga-arrow)"/>

  <rect x="478" y="16" width="408" height="499" rx="14" fill="#e7f2ea" class="panel"/>
  <text x="682" y="52" text-anchor="middle" class="title">Embargoed holdout</text>

  <rect x="504" y="88" width="356" height="64" rx="10" fill="#d9e4f2" stroke="#1e3a5f" stroke-width="2"/>
  <text x="682" y="116" text-anchor="middle" class="label">2010-2012 burn-in</text>
  <text x="682" y="140" text-anchor="middle" class="note">Freeze 30 CPC candidates</text>

  <rect x="504" y="168" width="356" height="64" rx="10" fill="#cfe0f0" stroke="#1e3a5f" stroke-width="2"/>
  <text x="682" y="196" text-anchor="middle" class="label">2013-2019 train</text>
  <text x="682" y="220" text-anchor="middle" class="note">1,540,698 pairs</text>

  <rect x="504" y="248" width="356" height="64" rx="10" fill="#f4eee4" stroke="#7a5b20" stroke-width="2"/>
  <text x="682" y="276" text-anchor="middle" class="label">2020 embargo</text>
  <text x="682" y="300" text-anchor="middle" class="note">Unused year</text>

  <rect x="504" y="328" width="356" height="64" rx="10" fill="#dceee3" stroke="#215c3a" stroke-width="2"/>
  <text x="682" y="356" text-anchor="middle" class="label">2021-2022 test</text>
  <text x="682" y="380" text-anchor="middle" class="note">10,411 firms, 1.11% positives</text>

  <text x="682" y="456" text-anchor="middle" class="label">M1, M2 activity; M3 + graph</text>
  <text x="682" y="486" text-anchor="middle" class="note">CN, peer adoption, degree; no GNN</text>

  <path d="M898 266 H928" stroke="#1e293b" stroke-width="4" marker-end="url(#ga-arrow)"/>

  <rect x="940" y="16" width="372" height="499" rx="14" fill="#f4eee4" class="panel"/>
  <text x="1126" y="52" text-anchor="middle" class="title">Held-out AP</text>

  <text x="964" y="102" class="barlab">M1  0.0313</text>
  <rect x="964" y="112" width="324" height="22" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <rect x="964" y="112" width="254" height="22" rx="4" fill="#5b82b0"/>

  <text x="964" y="164" class="barlab">M2  0.0155</text>
  <rect x="964" y="174" width="324" height="22" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <rect x="964" y="174" width="126" height="22" rx="4" fill="#64748b"/>

  <text x="964" y="226" class="barlab">M3  0.0326</text>
  <rect x="964" y="236" width="324" height="22" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <rect x="964" y="236" width="264" height="22" rx="4" fill="#2f7d4a"/>

  <text x="1126" y="318" text-anchor="middle" class="hero-sub">M3 minus M2 forest</text>
  <text x="1126" y="376" text-anchor="middle" class="hero">&#916;AP +0.017</text>
  <text x="1126" y="416" text-anchor="middle" class="label">95% 0.0155 to 0.0191</text>
  <text x="1126" y="456" text-anchor="middle" class="label">AP 0.033 vs 1.11% base</text>
  <text x="1126" y="486" text-anchor="middle" class="note">Inspectable, not decision-ready</text>
</svg>
